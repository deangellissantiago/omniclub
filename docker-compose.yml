services:
  mongo:
    image: mongo:7
    container_name: checkin-mongo
    restart: unless-stopped
    ports:
      - "29999:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkin-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__DatabaseName: checkin_db
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_super_secret_key_min_32_chars_long}
      Jwt__Issuer: checkin-api
      Jwt__Audience: checkin-clients
      # Sem fallback vazio para BaseUrl: uma string vazia aqui sobrescreveria o default válido
      # de appsettings.json e quebraria o HttpClient (sem BaseAddress) se o .env ficar em branco.
      Wellhub__BaseUrl: ${WELLHUB_BASE_URL:-https://api.partners.gympass.com}
      Wellhub__ApiKey: ${WELLHUB_API_KEY:-}
      Wellhub__WebhookSecret: ${WELLHUB_WEBHOOK_SECRET:-CHANGE_ME_webhook_secret}
      Billing__SecretKey: ${STRIPE_SECRET_KEY:-}
      Billing__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Billing__PriceAmountCents: ${STRIPE_PRICE_AMOUNT_CENTS:-9900}
      Billing__Currency: ${STRIPE_CURRENCY:-brl}
      Billing__FrontendBaseUrl: ${FRONTEND_URL:-http://localhost:5271}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:5271}
      # Serviço standalone de WhatsApp (repositório separado, github.com/.../whatsapp-service —
      # ver seu README). Vazio = régua de relacionamento desligada (RetentionAlertHostedService
      # só loga "pulado", não quebra o resto da API). Aponte pro nome do container na rede
      # whatsapp_shared (ver abaixo), não pra localhost — o backend roda dentro do container.
      WhatsApp__BaseUrl: ${WHATSAPP_SERVICE_BASE_URL:-}
      WhatsApp__ApiKey: ${WHATSAPP_SERVICE_API_KEY:-}
      RetentionAlerts__IntervalHours: ${RETENTION_ALERTS_INTERVAL_HOURS:-24}
    ports:
      - "5280:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5280/api}
    container_name: checkin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5271:80"

volumes:
  mongo-data:
