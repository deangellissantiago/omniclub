server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy interno para a API: em produção o Caddy compartilhado só conhece
    # este container (omniclub-frontend), não o backend — o backend fica
    # isolado na rede interna do compose, inalcançável de fora do Docker.
    # O prefixo /api/ é repassado sem alteração porque as rotas do backend já
    # são registradas como api/... (ver [Route("api/...")] nos controllers).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota cai no index.html (roteamento via React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
